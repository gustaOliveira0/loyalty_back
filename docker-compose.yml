version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: loyalty123
      POSTGRES_DB: loyalty_backend_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://loyalty:loyalty123@db:5432/loyalty_backend_development
      RAILS_ENV: development
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      POSTGRES_PASSWORD: loyalty123
      FRONTEND_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
