version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: loyalty123
      POSTGRES_DB: loyalty_backend_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    command: bash -c "rm -f tmp/pids/server.pid && echo 'Aguardando PostgreSQL...' && bundle exec rails db:create db:migrate && echo 'Iniciando servidor...' && bundle exec rails server -b 0.0.0.0 -p 3000"
    environment:
      DATABASE_URL: postgres://loyalty:loyalty123@db:5432/loyalty_backend_development
      RAILS_ENV: development
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      POSTGRES_PASSWORD: loyalty123
      FRONTEND_URL: https://loyalty-front-gray.vercel.app/
      # LGPD (Art. 46) — criptografia do CPF em repouso. Em produção, gere chaves
      # fortes com `bin/rails db:encryption:init` e defina-as via segredos/ENV.
      # Estes valores são apenas para o ambiente local de desenvolvimento.
      AR_ENCRYPTION_PRIMARY_KEY: dev_only_primary_key_change_in_production_xx
      AR_ENCRYPTION_DETERMINISTIC_KEY: dev_only_deterministic_key_change_in_prod_xx
      AR_ENCRYPTION_KEY_DERIVATION_SALT: dev_only_key_derivation_salt_change_in_prod_xx
      # LGPD/segurança — restrinja as origens permitidas em produção (CORS).
      # ALLOWED_ORIGINS: https://app.sualoja.com.br
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
